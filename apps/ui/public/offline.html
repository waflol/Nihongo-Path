<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Mất kết nối | Nihongo Path</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --brand: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --brand: #818cf8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Bạn đang offline</h1>
      <p>Nihongo Path cần kết nối mạng để tải bài học và lưu tiến độ ôn tập. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
